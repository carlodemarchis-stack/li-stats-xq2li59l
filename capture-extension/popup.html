<meta charset="utf-8">
<title>LinkedIn Activity Capture</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; width: 340px;
    background: #14161a; color: #e8eaed;
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .wrap { padding: 12px; }
  #url {
    margin: 0 0 10px; font-size: 11px; color: #8b919c;
    word-break: break-all; max-height: 32px; overflow: hidden;
  }
  .row { display: flex; align-items: center; gap: 8px; }
  label { color: #8b919c; white-space: nowrap; }
  select, input[type=date] {
    flex: 1; min-width: 0; background: #1c1f25; color: #e8eaed;
    border: 1px solid #2c3038; border-radius: 6px; padding: 5px 8px; font: inherit;
  }
  select:focus, input:focus { outline: none; border-color: #5b8cff; }
  #date-row { margin-top: 8px; }
  #hint { font-size: 11px; color: #6b7280; margin-top: 6px; }
  button {
    background: #0a66c2; color: #fff; border: 1px solid #0a66c2;
    border-radius: 6px; padding: 7px 12px; font: 600 12px/1 inherit; cursor: pointer;
  }
  button:disabled { background: #191c21; color: #545a64; border-color: #24282f; cursor: default; }
  #msg { font-size: 11px; color: #8b919c; margin-top: 9px; min-height: 15px; }
  #msg.err { color: #ff8f8f; }
  #msg.ok { color: #7ee08a; }
</style>
<div class="wrap">
  <div id="url"></div>
  <div class="row">
    <label for="range">Scroll back to</label>
    <select id="range">
      <option value="store-newest">newest post in the store</option>
      <option value="store-oldest">oldest post in the store</option>
      <option value="this-month">this month</option>
      <option value="last-month">last month</option>
      <option value="this-year">this year</option>
      <option value="one-year">one year</option>
      <option value="weeks">5 weeks</option>
      <option value="date">a date…</option>
    </select>
    <button id="go" disabled>Capture</button>
  </div>
  <div class="row" id="date-row" hidden>
    <label for="date">Date</label>
    <input id="date" type="date">
  </div>
  <div id="hint"></div>
  <div id="msg"></div>
</div>
<script src="popup.js"></script>
